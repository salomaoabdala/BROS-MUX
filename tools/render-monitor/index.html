<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BROS-MUX — Monitor de render</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e3e6ea;
    --ink:#16181d; --ink-2:#5b6472; --ink-3:#8b94a3;
    --accent:#2a6df4; --accent-soft:#dbe6fe;
    --good:#1a7f45; --warn:#9a5b00; --crit:#b4232a;
    --track:#e6e9ee;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --line:#2a313b;
      --ink:#e9edf3; --ink-2:#a5b0c0; --ink-3:#74808f;
      --accent:#6f9cff; --accent-soft:#1e2c4a;
      --good:#4fc07c; --warn:#e2a33c; --crit:#f0666d;
      --track:#242b35;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       padding:20px 16px 40px}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:18px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--ink-2);font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;
       margin-right:6px;vertical-align:1px}
  .dot.off{background:var(--ink-3)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        padding:18px;margin-bottom:16px}
  .card h2{font-size:15.5px;margin:0 0 2px;letter-spacing:-.01em;word-break:break-all}
  .path{color:var(--ink-3);font-size:11.5px;word-break:break-all;margin-bottom:14px}
  .hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:6px}
  .pct{font-size:44px;font-weight:650;line-height:1;letter-spacing:-.03em;
       font-variant-numeric:tabular-nums}
  .pct span{font-size:18px;font-weight:500;color:var(--ink-2)}
  .herolab{color:var(--ink-2);font-size:12.5px;padding-bottom:4px}
  .bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:12px 0 4px;
       display:flex;gap:2px}
  .bar i{display:block;background:var(--accent);height:100%;border-radius:5px}
  .bar i.ghost{background:var(--accent-soft)}
  .barlab{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
        background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        margin:16px 0}
  .kpi{padding:11px 13px;box-shadow:inset 1px 0 0 var(--line),inset 0 1px 0 var(--line)}
  .kpi b{display:block;font-size:21px;font-weight:620;letter-spacing:-.02em;
         font-variant-numeric:tabular-nums}
  .kpi small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px}
  .kpi em{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink-3);font-weight:500;font-size:11.5px;
     text-transform:uppercase;letter-spacing:.04em;padding:0 8px 6px 0}
  td{padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:top;
     font-variant-numeric:tabular-nums}
  td.name{font-variant-numeric:normal}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);
       color:var(--ink-2);white-space:nowrap}
  .tag.now{background:var(--accent-soft);color:var(--accent)}
  .tag.done{color:var(--good)}
  .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
       margin:18px 0 8px}
  .empty{color:var(--ink-2);padding:8px 0}
  svg .grid{stroke:var(--line);stroke-width:1}
  svg .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  svg .area{fill:var(--accent);opacity:.14;stroke:none}
  svg .ref{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  svg .ref.cap{stroke:var(--crit);opacity:.5}
  svg .cursor{stroke:var(--accent);stroke-width:2}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
  .two.frame img{width:100%;border-radius:8px;display:block;background:var(--surface-2)}
  .pct2{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pct2 span{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:4px}
  @media (max-width:720px){ .two{grid-template-columns:1fr} }
  svg text{fill:var(--ink-3);font-size:10.5px}
  .note{color:var(--ink-2);font-size:12.5px;margin-top:10px;padding-left:10px;border-left:2px solid var(--warn)}
  .note b{color:var(--ink)}
  .note code{font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BROS-MUX — Monitor de render</h1>
    <div class="sub" id="meta">conectando…</div>
  </header>
  <div id="err"></div>
  <div id="jobs"></div>
  <div class="sec">Sessões de render abertas</div>
  <div class="card" id="sessions"></div>
  <div class="sub" id="foot"></div>
</div>
<script>
const $ = (s,r=document)=>r.querySelector(s);

function hmsc(s){  // compacto, para faixas: 5h54
  if(s==null||!isFinite(s)) return "—";
  s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return h? h+"h"+String(m).padStart(2,"0") : m+" min";
}
function hms(s){
  if(s==null||!isFinite(s)) return "—";
  s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  if(h) return h+" h "+String(m).padStart(2,"0")+" min";
  if(m) return m+" min "+String(x).padStart(2,"0")+" s";
  return x+" s";
}
function clock(t){
  if(!t) return "—";
  return new Date(t*1000).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function n(v,d=1){ return v==null?"—":v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function int(v){ return v==null?"—":v.toLocaleString("pt-BR"); }
function tcf(f,fps){
  if(f==null) return "—";
  const s=Math.floor(f/(fps||24)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");
}
function gb(b){ return b==null?"—":(b/1e9).toFixed(2).replace(".",",")+" GB"; }

function spark(hist){
  if(!hist || hist.length<2) return '<div class="empty">Juntando amostras do fps… (um ponto a cada 30 s)</div>';
  const W=640,H=110,P=26;
  const fps=hist.map(p=>p.fps), t0=hist[0].t, t1=hist[hist.length-1].t;
  const lo=Math.min(...fps)*0.85, hi=Math.max(...fps)*1.1;
  const x=p=>P+(p.t-t0)/Math.max(1,(t1-t0))*(W-P-8);
  const y=p=>H-18-(p.fps-lo)/Math.max(.001,(hi-lo))*(H-34);
  const d=hist.map((p,i)=>(i?"L":"M")+x(p).toFixed(1)+","+y(p).toFixed(1)).join(" ");
  const dots=hist.map(p=>`<circle cx="${x(p).toFixed(1)}" cy="${y(p).toFixed(1)}" r="7" fill="transparent"><title>${p.fps.toFixed(1)} fps às ${clock(p.t)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="fps ao longo do tempo">
    <line class="grid" x1="${P}" y1="${H-18}" x2="${W-8}" y2="${H-18}"/>
    <text x="0" y="20">${hi.toFixed(0)}</text><text x="0" y="${H-14}">${lo.toFixed(0)}</text>
    <path class="line" d="${d}"/>${dots}
    <text x="${P}" y="${H-4}">${clock(t0)}</text>
    <text x="${W-8}" y="${H-4}" text-anchor="end">${clock(t1)}</text>
  </svg>`;
}

function bitrateChart(j){
  const p=j.profile;
  if(!p || !p.buckets.length) return "";
  const W=900,H=190,L=46,R=10,T=14,B=26;
  const total=j.frames||p.buckets[p.buckets.length-1].f;
  const top=Math.max(p.max_mbps||0, ...p.buckets.map(b=>b.mbps))*1.05;
  const x=f=>L+(f/total)*(W-L-R);
  const y=v=>T+(1-v/top)*(H-T-B);
  const step=(p.buckets[1]?p.buckets[1].f-p.buckets[0].f:1);
  let d="M"+x(0).toFixed(1)+","+y(0).toFixed(1);
  p.buckets.forEach(b=>{ d+=" L"+x(b.f).toFixed(1)+","+y(b.mbps).toFixed(1)+" L"+x(b.f+step).toFixed(1)+","+y(b.mbps).toFixed(1); });
  const lastf=p.buckets[p.buckets.length-1].f+step;
  const area=d+" L"+x(lastf).toFixed(1)+","+y(0).toFixed(1)+" Z";
  const hits=p.buckets.map(b=>`<rect x="${x(b.f).toFixed(1)}" y="${T}" width="${Math.max(1,(x(step)-x(0))).toFixed(1)}" height="${H-T-B}" fill="transparent"><title>${tcf(b.f,j.fps_video)} · ${b.mbps.toLocaleString("pt-BR")} Mbps</title></rect>`).join("");
  const line=(v,lab,cls)=>v?`<line class="ref ${cls||''}" x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${lab}</text>`:"";
  const cur=j.frame!=null?`<line class="cursor" x1="${x(j.frame).toFixed(1)}" y1="${T-6}" x2="${x(j.frame).toFixed(1)}" y2="${H-B}"/>`:"";
  return `<div class="sec">Bitrate que cada cena vai receber na passada 2 — estimativa</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="bitrate estimado por cena ao longo do filme">
    <path class="area" d="${area}"/><path class="line" d="${d}"/>
    ${line(p.max_mbps,p.max_mbps+" teto","cap")}${line(p.target_mbps,p.target_mbps+" alvo")}
    ${cur}${hits}
    <text x="${L}" y="${H-6}">00:00</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${tcf(total,j.fps_video)}</text>
  </svg>
  <div class="barlab"><span>${p.frames_measured.toLocaleString("pt-BR")} frames já medidos · ${p.scenes} cenas${p.complete?"":" · a passada 1 ainda está medindo, os números ainda mudam"}</span><span>média ${n(p.avg_mbps)} Mbps</span></div>`;
}

function sceneTables(j){
  const p=j.profile; if(!p) return "";
  const row=s=>`<tr><td>${tcf(s.start,j.fps_video)}</td><td>${Math.round(s.frames/(j.fps_video||24))} s</td><td><b>${n(s.mbps)}</b> Mbps</td>${s.mbps_floor!==undefined?`<td class="sub">piso ${n(s.mbps_floor,2)}</td>`:""}</tr>`;
  const floor = p.floor_qp ? `<div class="note">
      <b>Piso de qualidade: QP ${p.floor_qp}</b> (<code>qpmax=${p.floor_qp}</code>, ligado neste job). É um piso de
      <b>qualidade</b>, não de bitrate: nenhum frame sai pior que QP ${p.floor_qp}, por mais fácil que a cena seja.
      Cena fácil gastando pouco não é cena mal codificada — preto é barato.
      A cena mais leve aqui custaria <b>${n(p.lightest[0] && p.lightest[0].mbps_floor,2)} Mbps</b> no piso, e a estimativa já dá
      ${n(p.lightest[0] && p.lightest[0].mbps)} Mbps, muito acima dele.
      O filme inteiro no piso custaria <b>${n(p.floor_avg_mbps)} Mbps</b> de média, e você pediu ${n(p.target_mbps)} —
      ${n(p.target_mbps/p.floor_avg_mbps,1)}× o piso.
      ${p.floor_over_cap?`Onde aperta é o outro lado: <b>${p.floor_over_cap.toLocaleString("pt-BR")} frames</b> (${n(100*p.floor_over_cap/p.frames_measured)}% dos medidos)
      precisariam de mais de ${n(p.max_mbps)} Mbps só para ficar no piso, e o teto não deixa.`:""}
    </div>` : "";
  return `<div class="two">
    <div><div class="sec">Cenas mais pesadas</div><table>${p.heaviest.map(row).join("")}</table></div>
    <div><div class="sec">Cenas mais leves</div><table>${p.lightest.map(row).join("")}</table></div>
  </div>${floor}`;
}

function framePane(j){
  const sc=j.profile && j.profile.scene_now;
  return `<div class="two frame">
    <div><img id="img${j.pid}" src="/frame.jpg?pid=${j.pid}&t=${Math.floor(Date.now()/12000)}" alt="frame ${j.frame}">
      <div class="barlab"><span>frame ${int(j.frame)} · ${tcf(j.frame,j.fps_video)}</span><span>atualiza a cada 12 s</span></div></div>
    <div>
      <div class="sec">Cena de agora</div>
      ${sc?`<div class="pct2">${n(sc.mbps)}<span>Mbps</span></div>
        <div class="sub">é o que a passada 2 deve dar para esta cena — a ${sc.rank}ª mais pesada de ${j.profile.scenes} medidas até aqui.</div>
        <div class="sub" style="margin-top:6px">Começou em ${tcf(sc.start,j.fps_video)} e dura ${Math.round(sc.frames/(j.fps_video||24))} s (${sc.frames} frames).</div>
        ${j.profile.lag_frames>240?`<div class="sub" style="margin-top:6px;color:var(--ink-3)">O x265 grava as estatísticas em blocos de 4 MiB, então o bitrate por cena vem <b>${hms(j.profile.lag_frames/j.fps_video)} de filme atrás</b> do frame que está sendo medido: esta cena é a de ${tcf(j.frame-j.profile.lag_frames,j.fps_video)}, não a da imagem ao lado (${tcf(j.frame,j.fps_video)}). O atraso cresce nas cenas pesadas, que demoram mais para encher um bloco, e some na passada 2, quando o arquivo já está pronto.</div>`:""}`
        :'<div class="empty">Esperando as estatísticas da passada 1.</div>'}
    </div>
  </div>`;
}

function jobCard(j,now){
  const pct = j.pct_total!=null?j.pct_total:(j.pct_stage||0);
  const passTxt = j.pass_no?`passada ${j.pass_no} de ${j.pass_of}`:"";
  const segs = (()=>{
    if(!j.pass_of) return `<i style="flex:${pct}"></i><i class="ghost" style="flex:${100-pct}"></i>`;
    const each=100/j.pass_of, done=j.frame/j.frames*each;
    let h="";
    for(let p=1;p<=j.pass_of;p++){
      const f = p<j.pass_no?each : p===j.pass_no?done : 0;
      h+=`<i style="flex:${f.toFixed(2)}"></i>`;
      const rest = p<j.pass_no?0 : p===j.pass_no?each-done : each;
      h+=`<i class="ghost" style="flex:${rest.toFixed(2)}"></i>`;
    }
    return h;
  })();
  const stages = j.stages.map(s=>`<tr>
      <td class="name">${s.name}</td>
      <td>${clock(s.start)}${s.estimated?' <span class="tag">estimado</span>':''}</td>
      <td>${hms(s.elapsed)}</td>
      <td><span class="tag ${s.state==='atual'?'now':'done'}">${s.state}</span></td>
    </tr>`).join("");
  const notes = [];
  if(j.fps_avg && j.fps_typical && j.fps_avg > j.fps_typical*1.15)
    notes.push(`A <b>média desde o início</b> (${n(j.fps_avg)} fps) está acima do ritmo real (${n(j.fps_typical)} fps) porque o começo do filme — preto e créditos — correu muito rápido. Ela vai descendo sozinha até encostar no ritmo real; <b>não é queda de desempenho</b>. A conta de tempo aqui usa o fps típico, não a média.`);
  if(j.fps_now && j.fps_typical && j.fps_now < j.fps_typical*0.75)
    notes.push(`O fps de agora (${n(j.fps_now)}) está abaixo do típico (${n(j.fps_typical)}): a cena atual é mais pesada que a média do filme.`);
  if(j.fast_first_pass && j.pass_no===1)
    notes.push(`A passada 1 roda com análise reduzida (<code>slow-firstpass=0</code>) e por isso é rápida. A <b>passada 2 usa o preset <i>slow</i> inteiro e deve levar de 2 a 3,5 vezes mais tempo</b> — é essa faixa que está no "falta até o fim". Quando a passada 2 começar, a conta passa a usar a velocidade medida dela.`);
  const slow = notes.map(t=>`<div class="note">${t}</div>`).join("");
  return `<div class="card">
    <h2>${j.title}</h2>
    <div class="path">${j.output||""} · pid ${j.pid} · log ${j.log||"—"}</div>
    <div class="hero">
      <div class="pct">${n(pct)}<span>%</span></div>
      <div class="herolab">do trabalho inteiro${passTxt?" · "+passTxt:""}<br>${j.stage||""}</div>
    </div>
    <div class="bar">${segs}</div>
    <div class="barlab"><span>início ${clock(j.started)}</span><span>frame ${int(j.frame)} de ${int(j.frames)}</span></div>
    <div class="kpis">
      <div class="kpi"><b>${n(j.fps_now)}</b><small>fps agora</small></div>
      <div class="kpi"><b>${n(j.fps_typical)}</b><small>fps típico (base da conta)</small></div>
      <div class="kpi"><b>${n(j.fps_avg)}</b><small>fps médio desde o início</small></div>
      <div class="kpi"><b><em>${hms(j.elapsed)}</em></b><small>decorrido no trabalho</small></div>
      <div class="kpi"><b><em>${hms(j.eta_stage)}</em></b><small>falta nesta passada</small></div>
      <div class="kpi"><b><em>${j.eta_total_max?hmsc(j.eta_total)+" a "+hmsc(j.eta_total_max):hms(j.eta_total)}</em></b><small>falta até o fim</small></div>
      <div class="kpi"><b><em>${j.eta_total?clock(now+j.eta_total)+(j.eta_total_max?" – "+clock(now+j.eta_total_max):""):"—"}</em></b><small>término previsto</small></div>
    </div>
    ${spark(j.fps_history)}
    ${slow}
    ${framePane(j)}
    ${bitrateChart(j)}
    ${sceneTables(j)}
    <div class="sec">Tempo decorrido em cada etapa</div>
    <table><thead><tr><th>Etapa</th><th>Começou</th><th>Durou</th><th>Estado</th></tr></thead>
    <tbody>${stages||'<tr><td class="name">—</td><td>—</td><td>—</td><td>—</td></tr>'}</tbody></table>
    ${j.partial?`<div class="barlab" style="margin-top:12px"><span>arquivo parcial: ${j.partial.name}</span><span>${gb(j.partial.bytes)}</span></div>`:""}
  </div>`;
}

async function tick(){
  let s;
  try{ s = await (await fetch("/status.json",{cache:"no-store"})).json(); }
  catch(e){ $("#meta").innerHTML = '<span class="dot off"></span>monitor fora do ar'; return; }
  const run = s.jobs.length>0;
  $("#meta").innerHTML = `<span class="dot ${run?"":"off"}"></span>${s.host} · ${s.chip} · ${s.cores} núcleos · carga ${s.load[0]} · ${run?s.jobs.length+(s.jobs.length>1?" processos":" processo")+" do BROS-MUX":"BROS-MUX fechado"}`;
  const working = s.jobs.filter(j=>j.frame!=null||j.tool);
  $("#jobs").innerHTML = working.length ? working.map(j=>jobCard(j,s.now)).join("")
    : `<div class="card empty">${run?"O BROS-MUX está aberto e parado — nada sendo processado agora.":"Nenhum BROS-MUX rodando. A página se atualiza sozinha quando você abrir um."}</div>`;
  const rows = s.jobs.map(j=>({
    n:(j.gui?"BROS-MUX aberto por você":"Render pela linha de comando")+(j.title&&j.title!=="BROS-MUX job"?" — "+j.title:""),
    pid:j.pid, st:j.started, el:j.elapsed, cpu:j.cpu, stage:j.stage }));
  $("#sessions").innerHTML = rows.length? `<table>
      <thead><tr><th>Sessão</th><th>Fazendo</th><th>pid</th><th>Começou</th><th>Decorrido</th><th>CPU</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="name">${r.n}</td><td class="name">${r.stage||"—"}</td><td>${r.pid}</td><td>${clock(r.st)}</td><td>${hms(r.el)}</td><td>${r.cpu?Math.round(r.cpu)+"%":"—"}</td></tr>`).join("")}</tbody></table>`
    : '<div class="empty">Nada do BROS-MUX aberto.</div>';
  $("#err").innerHTML = s.stats_error
    ? `<div class="note">Não consegui ler o arquivo de estatísticas do x265: ${s.stats_error}. O gráfico de bitrate por cena fica de fora até isso voltar.</div>` : "";
  $("#foot").textContent = "Atualizado às "+clock(s.now)+" · a página se atualiza a cada 3 s · só leitura, não interfere no render.";
}
tick(); setInterval(tick,3000);
</script>
</body>
</html>
